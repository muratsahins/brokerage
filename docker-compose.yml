services:
  db:
    image: postgres:16
    container_name: brokerage-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: brokerage
    ports:
      - "5432:5432"
    volumes:
      - brokerage-pgdata:/var/lib/postgresql/data

volumes:
  brokerage-pgdata:
