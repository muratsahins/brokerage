name: BIST verisini yenile

# Analist verisi Render'ın datacenter IP'sinde throttle olduğu için,
# veriyi taze bir GitHub runner IP'sinde çekip repoya yayınlıyoruz.
on:
  schedule:
    - cron: '0 */3 * * *'   # her 3 saatte bir (UTC)
  workflow_dispatch:          # elle tetikleme (Actions sekmesinden "Run workflow")

permissions:
  contents: write             # data/*.json commit'lemek için

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Backend bağımlılıkları
        working-directory: backend
        run: npm ci

      - name: Veriyi çek ve JSON'a yaz
        working-directory: backend
        run: node src/publish.js ../data/recommendations.json

      - name: Değişikliği commit'le
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/recommendations.json
          if git diff --staged --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "chore: BIST verisi güncellendi [skip ci]"
            # main'e push eden başka turlar var (ABD veri turu, ayrıca elle
            # tetiklemeler ve başka dallardan gelen işler). Araya girip push'u
            # reddettirirlerse aşağıdaki döngü toparlıyor.
            for deneme in 1 2 3; do
              git push && exit 0
              echo "Push reddedildi (deneme $deneme); uzak alınıp veri yeniden yazılacak."
              # ÖNEMLİ: rebase DENENMİYOR. Bu dosya üretilen bir çıktı; aynı
              # dosyayı yazan başka bir tur araya girdiyse rebase içerik
              # çakışması verip duruyordu (yaşandı). Birleştirmenin anlamı da
              # yok — iki taraf da tam anlık görüntü. Uzağın üstüne BİZİM taze
              # sürümü yazıp yeniden commit'liyoruz.
              cp data/recommendations.json /tmp/veri-yeni.json
              git fetch origin main
              git reset --hard origin/main
              cp /tmp/veri-yeni.json data/recommendations.json
              git add data/recommendations.json
              git diff --staged --quiet || git commit -m "chore: BIST verisi güncellendi [skip ci]"
              sleep 3
            done
            echo "::error::Push 3 denemede de başarısız oldu."
            exit 1
          fi
