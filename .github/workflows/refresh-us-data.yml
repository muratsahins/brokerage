name: ABD verisini yenile

# BIST akışından bağımsız: NASDAQ100+S&P100 temel verisi (gelir büyümesi,
# marj, Net Debt/EBITDA, FCF, analist hedefi) günde 1 kez tazelenir — bu
# veriler BIST fiyat/momentumu kadar sık değişmez. Aynı throttle nedeniyle
# (bkz. refresh-data.yml) taze bir GitHub runner IP'sinde çekilip repoya
# yayınlanıyor.
on:
  schedule:
    # Dakika 47 — ne saat başı ne de :30. Ölçüm: saat başına kurulu turlar 50-100
    # dakika gecikmeyle başlıyor, hatta bazı slotlar tamamen düşüyordu (dün 9
    # saatlik slottan 7'si çalıştı). Saat başı GitHub'ın en yoğun anı, :30 de
    # yoğun; tetik ikisinden de kaydırıldı.
    # BIST turu :17'de ve ikisi de main'e push ediyor — araya 30 dakika kondu.
    # Push adımındaki tekrar deneme döngüsü yine de yedek olarak duruyor.
    - cron: '47 6 * * *'    # her gün 06:47 UTC (hafta sonu dahil taban tur)
    # ABD seansı boyunca saatlik: analist hedefi yavaş değişir ama fiyat
    # değiştikçe potansiyel/puan zaten CANLI hesaplanıyor (/api/us-prices);
    # bu tur yalnızca hedef fiyat ve temel verileri tazeler.
    - cron: '47 13-21 * * 1-5'  # hafta içi 13:47-21:47 UTC, saatte bir
  workflow_dispatch:          # elle tetikleme (Actions sekmesinden "Run workflow")

permissions:
  contents: write             # data/*.json commit'lemek için

concurrency:
  group: refresh-us-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Backend bağımlılıkları
        working-directory: backend
        run: npm ci

      - name: Veriyi çek ve JSON'a yaz
        working-directory: backend
        run: node src/publish-us.js ../data/us-recommendations.json

      - name: Değişikliği commit'le
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/us-recommendations.json
          if git diff --staged --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "chore: ABD verisi güncellendi [skip ci]"
            # main'e push eden başka turlar var (BIST veri turu, ayrıca elle
            # tetiklemeler ve başka dallardan gelen işler). Araya girip push'u
            # reddettirirlerse aşağıdaki döngü toparlıyor.
            for deneme in 1 2 3; do
              git push && exit 0
              echo "Push reddedildi (deneme $deneme); uzak alınıp veri yeniden yazılacak."
              # ÖNEMLİ: rebase DENENMİYOR. Bu dosya üretilen bir çıktı; aynı
              # dosyayı yazan başka bir tur araya girdiyse rebase içerik
              # çakışması verip duruyordu (yaşandı). Birleştirmenin anlamı da
              # yok — iki taraf da tam anlık görüntü. Uzağın üstüne BİZİM taze
              # sürümü yazıp yeniden commit'liyoruz.
              cp data/us-recommendations.json /tmp/veri-yeni.json
              git fetch origin main
              git reset --hard origin/main
              cp /tmp/veri-yeni.json data/us-recommendations.json
              git add data/us-recommendations.json
              git diff --staged --quiet || git commit -m "chore: ABD verisi güncellendi [skip ci]"
              sleep 3
            done
            echo "::error::Push 3 denemede de başarısız oldu."
            exit 1
          fi
