name: ABD verisini yenile

# BIST akışından bağımsız: NASDAQ100+S&P100 temel verisi (gelir büyümesi,
# marj, Net Debt/EBITDA, FCF, analist hedefi) günde 1 kez tazelenir — bu
# veriler BIST fiyat/momentumu kadar sık değişmez. Aynı throttle nedeniyle
# (bkz. refresh-data.yml) taze bir GitHub runner IP'sinde çekilip repoya
# yayınlanıyor.
on:
  schedule:
    # BIST turu her 3 saatte bir tam saatte çalışıyor (00, 03, 06, ...) ve ikisi
    # de main'e push ediyor. 06:00'da birebir çakışıyorlardı; yarım saat kaydırıldı.
    # Push adımındaki rebase+tekrar deneme yine de yedek olarak duruyor.
    - cron: '30 6 * * *'   # her gün 06:30 UTC
  workflow_dispatch:          # elle tetikleme (Actions sekmesinden "Run workflow")

permissions:
  contents: write             # data/*.json commit'lemek için

concurrency:
  group: refresh-us-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Backend bağımlılıkları
        working-directory: backend
        run: npm ci

      - name: Veriyi çek ve JSON'a yaz
        working-directory: backend
        run: node src/publish-us.js ../data/us-recommendations.json

      - name: Değişikliği commit'le
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/us-recommendations.json
          if git diff --staged --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "chore: ABD verisi güncellendi [skip ci]"
            # BIST veri turu (refresh-data.yml) da main'e push ediyor ve ayrı
            # bir concurrency grubunda olduğu için aynı anda çalışabiliyor.
            # Araya girip push'u reddettirirse rebase edip tekrar deniyoruz.
            # (İki iş akışı farklı dosyalara dokunduğu için rebase çakışmaz.)
            for deneme in 1 2 3; do
              git push && exit 0
              echo "Push reddedildi (deneme $deneme); rebase edilip tekrar denenecek."
              git pull --rebase --autostash
              sleep 5
            done
            echo "::error::Push 3 denemede de başarısız oldu."
            exit 1
          fi
